# ============================================================
# Dependabot — 依赖自动升级 PR（教学版全套 CI · 第 3 批）
# ============================================================
#   - github-actions：Actions 生态（本项目 CI 引入的各种 action/版本）自动升级
#   - docker：Dockerfile 基础镜像（ubuntu:24.04）自动升级
#   - docker-compose：compose 里的镜像（postgres:15）自动升级
#   - C++ 依赖为 vendored（third_party/）或系统包，Dependabot 管不到——人工跟进
# ============================================================
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
