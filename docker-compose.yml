services:
  postgres:
    image: postgres:15
    container_name: gocook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gocook
      POSTGRES_PASSWORD: gocook123
      POSTGRES_DB: gocookdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gocook -d gocookdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  gocook-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gocook-server
    restart: unless-stopped
    # 注入 .env（SMTP 邮件配置等随容器生效）。required: false = .env 可缺失：缺失时容器
    # 照常启动，SMTP 未配置走开发模式（验证码打容器日志）；此时 GOCOOK_JWT_SECRET 仍必须
    # 由宿主环境变量提供（否则下方 environment 的 :? 校验报错）。注意：environment: 优先级
    # 高于 env_file，下方显式项（DB 连接串/JWT/HOST/PORT）仍以 environment 为准，不会被 .env 覆盖
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
    environment:
      # 容器内连接 postgres 服务名，不走 localhost
      GOCOOK_DB_CONN_STRING: "dbname=gocookdb user=gocook password=gocook123 host=postgres port=5432"
      # JWT 签名密钥：必须显式提供，拒绝默认值（默认密钥可伪造任意用户 token）。
      # 生成方式：openssl rand -base64 32；写入同目录 .env（GOCOOK_JWT_SECRET=...）或导出环境变量。
      GOCOOK_JWT_SECRET: "${GOCOOK_JWT_SECRET:?请在 .env 或环境变量中设置 GOCOOK_JWT_SECRET（openssl rand -base64 32 生成）}"
      GOCOOK_HOST: "0.0.0.0"
      GOCOOK_PORT: "8080"
      GOCOOK_LOG_LEVEL: "info"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server/uploads:/app/server/uploads

volumes:
  postgres_data:
